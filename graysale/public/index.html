<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GraySale · Retail Management</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-screen" class="hidden">
  <form class="login-box" id="login-form">
    <div class="login-logo">GS</div>
    <h1>GraySale</h1>
    <p class="login-sub">Retail Point of Sale &amp; Accounting</p>
    <div class="login-field"><label>Username</label><input id="login-user" value="admin" autocomplete="username" autocapitalize="off"></div>
    <div class="login-field"><label>Password</label><input id="login-pass" type="password" value="Admin123" autocomplete="current-password"></div>
    <div id="login-err" class="login-err"></div>
    <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
    <p class="login-hint">Default: admin / Admin123</p>
  </form>
</div>

<div id="app" class="hidden">
  <div id="topbar">
    <div class="brand"><span class="brand-mark">GS</span>GraySale</div>
    <div id="module-title">Welcome</div>
    <div class="topbar-spacer"></div>
    <div id="tb-clock"></div>
    <button class="btn-outline logout-btn" id="btn-user" title="Account"><span id="tb-username">…</span></button>
    <button class="btn-outline logout-btn" id="btn-logout">Log Out</button>
  </div>

  <nav id="menu">
    <button class="menu-item" data-nav="dashboard">Dashboard</button>
    <button class="menu-item" data-nav="pos">Point of Sale</button>
    <button class="menu-item" data-nav="stock">Stock Control</button>
    <button class="menu-item" data-nav="invoices">Invoicing / Quotes</button>
    <button class="menu-item" data-nav="purchasing">Purchasing</button>
    <button class="menu-item" data-nav="customers">Customers</button>
    <button class="menu-item" data-nav="suppliers">Suppliers</button>
    <button class="menu-item" data-nav="accounting">Accounting</button>
    <button class="menu-item" data-nav="reports">Sales Analysis</button>
    <button class="menu-item" data-nav="eod">Day Close</button>
    <button class="menu-item" data-nav="settings">Settings</button>
  </nav>

  <div id="app-body">
    <aside id="sidebar-content"></aside>
    <main id="content"></main>
  </div>

  <div id="statusbar">
    <span id="sb-left">Welcome to GraySale</span>
    <span class="status-spacer"></span>
    <span id="sb-right">SQLite · Local</span>
  </div>
</div>

<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
