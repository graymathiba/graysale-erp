services:
  - type: web
    name: graysale-portal
    runtime: static
    rootDir: graysale
    buildCommand: node scripts/build-portal.mjs
    staticPublishPath: cloud-portal/dist
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
